# Version web installable (PWA) de Simulix Pro sur GitHub Pages :
# https://pepinou66.github.io/simulix-pro/ — installable sur Android, iPhone et iPad
# (navigateur → « Installer l'application » / « Sur l'écran d'accueil »).
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Version web (PWA)
on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: dep
        uses: actions/deploy-pages@v4
