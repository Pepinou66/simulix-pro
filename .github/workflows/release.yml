# Construit l'installateur Windows et publie la release GitHub
# (utilisée par la mise à jour automatique de Simulix Pro).
# Déclenchement : push d'un tag "v*" (ex. v1.2.0) — la version du tag doit
# correspondre à "version" dans desktop/package.json.
name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemblage de l'application web
        run: python build.py
      - name: Dépendances
        working-directory: desktop
        run: npm ci
      - name: Construction et publication
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
