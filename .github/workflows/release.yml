# Construit l'installateur Windows et publie la release GitHub
# (utilisée par la mise à jour automatique de Simulix Pro).
# Déclenchement : modification de desktop/package.json sur main (nouvelle "version")
# ou lancement manuel. La release v<version> est créée automatiquement ; si elle
# existe déjà, la publication est ignorée.
name: Release Windows
on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemblage de l'application web
        run: python build.py
      - name: Dépendances
        working-directory: desktop
        run: npm ci
      - name: Construction et publication
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

  # Application Android (Capacitor) : APK ajouté à la même release GitHub
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemblage de l'application web
        run: python build.py
      - name: Projet Android
        working-directory: mobile
        run: |
          npm ci
          npx cap add android
          npx @capacitor/assets generate --android
          VER=$(node -p "require('../desktop/package.json').version")
          CODE=$(node -p "const v=require('../desktop/package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+v[2]")
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          npx cap sync android
      - name: Construction de l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore  # même signature à chaque version : les mises à jour s'installent par-dessus
          ./gradlew assembleDebug --no-daemon
      - name: Publication dans la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "Simulix-Pro-Android-$VER.apk"
          gh release upload "v$VER" "Simulix-Pro-Android-$VER.apk" --clobber
