# Construit l'installateur Windows et publie la release GitHub
# (utilisée par la mise à jour automatique de Simulix Pro).
# Déclenchement : modification de desktop/package.json sur main (nouvelle "version")
# ou lancement manuel. La release v<version> est créée automatiquement ; si elle
# existe déjà, la publication est ignorée.
name: Release Windows
on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemblage de l'application web
        run: python build.py
      - name: Dépendances
        working-directory: desktop
        run: npm ci
      - name: Construction et publication
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
