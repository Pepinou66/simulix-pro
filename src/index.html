<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Simulix Pro — Conception et simulation de systèmes automatisés</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --line:#d6dbe3; --text:#1d2430; --muted:#6b7686;
  --accent:#0f62fe; --accent2:#e8f0ff; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --top:46px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;height:100%}
/* ---- top bar ---- */
#top{display:flex;align-items:center;gap:4px;padding:0 8px;background:#151b26;color:#fff;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#brand{font-weight:700;letter-spacing:.3px;margin-right:10px;display:flex;align-items:center;gap:6px}
#brand b{background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{font-weight:600;color:#93a4bd;font-size:10px;border:1px solid #3a4558;border-radius:4px;padding:0 4px}
.tb{background:transparent;color:#dfe6f0;border:1px solid transparent;border-radius:6px;padding:5px 8px;display:inline-flex;align-items:center;gap:5px;flex:none}
.tb:hover{background:#263044}
.tb.on{background:#2b3a55;border-color:#3d5179;color:#fff}
.tb:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:24px;background:#334;margin:0 4px;flex:none}
.tb.run{background:#15803d;color:#fff}
.tb.run:hover{background:#16a34a}
.tb.stop{background:#b91c1c;color:#fff}
#simtime{font-variant-numeric:tabular-nums;color:#9fb3cf;min-width:62px;text-align:right;flex:none}
select.tbs{background:#263044;color:#fff;border:1px solid #3a4558;border-radius:6px;padding:4px;flex:none}
/* ---- main ---- */
#main{display:grid;grid-template-columns:var(--palW,232px) 6px 1fr 6px var(--propW,270px);min-height:0;position:relative}
.split-h{cursor:col-resize;background:#d6dbe3;position:relative;z-index:4}
.split-h:hover,.split-h.on{background:#0f62fe}
#palette,#props{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0}
#props{border-right:0;border-left:1px solid var(--line)}
#center{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#views{flex:1;display:flex;min-height:0;position:relative}
#cv{flex:1;display:block;width:100%;min-width:0;min-height:0;touch-action:none;background:#fbfcfd;cursor:default}
#sheets{display:flex;gap:2px;padding:3px 6px 0;background:#e3e8ef;border-top:1px solid var(--line);overflow-x:auto;flex:none}
#sheets button{border:1px solid var(--line);border-bottom:0;background:#f4f6f9;border-radius:6px 6px 0 0;padding:4px 10px;color:var(--muted)}
#sheets button.on{background:#fff;color:var(--text);font-weight:600}
.pal-search{position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid var(--line);z-index:2}
.pal-search input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.cat{border-bottom:1px solid #eef0f3}
.cat>h4{margin:0;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#4a5568;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.cat>h4:hover{background:#f6f8fb}
.cat .items{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 8px 8px}
.cat.closed .items{display:none}
.pi{border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px;text-align:center;font-size:10.5px;line-height:1.15;color:#334;cursor:pointer;user-select:none;touch-action:none}
.pi:hover{border-color:var(--accent);background:var(--accent2)}
.pi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2) inset;background:var(--accent2)}
.pi canvas{display:block;margin:0 auto 2px;width:96px;height:52px}
/* ---- props ---- */
#props h3{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);background:#f8fafc;position:sticky;top:0;z-index:1}
.pp{padding:10px 12px}
.row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.row label{font-size:11px;color:var(--muted);font-weight:600}
.row input,.row select,.row textarea{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
.row.chk{flex-direction:row;align-items:center;gap:6px}
.row.chk input{width:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.dng{color:var(--err)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;background:#f6f8fb;border:1px solid #e8ecf2;border-radius:6px;padding:7px 9px;margin-bottom:9px}
.kv b{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:11.5px;line-height:1.4}
.badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.5px;font-weight:600;background:#eef2f7;color:#445}
.badge.err{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#15803d}.badge.warn{background:#fef3c7;color:#92400e}
/* ---- plot ---- */
#plot{background:#0f1520;color:#cfe;border-top:1px solid #000;height:0;overflow:hidden;transition:height .15s;position:relative}
#plot.open{height:190px}
#plotc{width:100%;height:100%;display:block}
#plotbar{position:absolute;right:6px;top:4px;display:flex;gap:4px}
#plotbar button{background:#1d2738;color:#cde;border:1px solid #2d3a50;border-radius:5px;padding:2px 7px;font-size:11px}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal.open{display:flex}
.dlg{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(1150px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.sm{width:min(560px,100%)}
.dlg header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f8fafc}
.dlg header h2{margin:0;font-size:15px;flex:1}
.dlg .body{overflow:auto;padding:12px 14px;flex:1;min-height:0}
.dlg footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;background:#f8fafc}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--text);font-weight:600}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid #e3e7ee;padding:4px 6px;text-align:left}
table.grid th{background:#f3f6fa;position:sticky;top:0}
table.grid td input{width:100%;border:1px solid transparent;padding:2px 4px;border-radius:4px}
table.grid td input:focus{border-color:var(--accent);outline:none}
/* ladder */
.ltools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ltools button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ltools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lwrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lgrid{border-left:4px solid #334;border-right:4px solid #334;overflow:auto;background:#fff;user-select:none}
.lgrid table{border-collapse:collapse}
.lgrid td{width:84px;height:54px;padding:0;border:1px dashed #edf0f4;position:relative;cursor:pointer}
.lgrid td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.lgrid td.rn{width:28px;color:#99a;font-size:10px;text-align:center;border:0;cursor:default;background:#fafbfc}
.lgrid svg{display:block;width:84px;height:54px}
.lside{min-width:220px;flex:1}
.gwrap{display:flex;gap:12px;flex-wrap:wrap}
.gwrap>div{flex:1;min-width:300px}
.gsvg{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;max-height:60vh}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--err);color:#fff;font-weight:700;padding:5px 12px;border-radius:6px;display:none;z-index:5}
/* seconde vue : scindée ou mini-fenêtre */
.pane2{display:none;flex-direction:column;background:#fff;min-width:0;min-height:0}
.pane2 canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none;background:#fbfcfd}
.p2h{display:flex;align-items:center;gap:6px;padding:4px 6px;background:#1e293b;color:#e2e8f0;font-size:12px;cursor:default;user-select:none}
.p2h select{flex:1;min-width:0;background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:2px 4px;font-size:12px}
.p2h button{background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:1px 7px}
#views.split .pane2{display:flex;flex:1;border-left:3px solid #1e293b}
#views.pip .pane2{display:flex;position:absolute;right:56px;bottom:12px;width:420px;height:280px;border:2px solid #1e293b;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:7;resize:both;min-width:220px;min-height:150px}
#views.pip .p2h{cursor:move}
#ctx{position:fixed;display:none;z-index:70;background:#fff;border:1px solid #d6dbe3;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;min-width:210px;font-size:13px;max-height:80vh;overflow:auto}
#ctx .it{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
#ctx .it:hover{background:#eef4ff}
#ctx .it.dis{opacity:.4;pointer-events:none}
#ctx .sep2{height:1px;background:#e5e7eb;margin:4px 2px}
#ctx .hd{padding:4px 10px;font-size:11px;color:#6b7686;font-weight:600}
#ctx input{width:100%;padding:5px 7px;border:1px solid #d6dbe3;border-radius:5px;margin:2px 0 4px}
#tip{position:absolute;display:none;pointer-events:none;background:#111827;color:#f9fafb;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
#modeTag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);pointer-events:none}
#zoomctl{position:absolute;right:8px;bottom:36px;display:flex;flex-direction:column;gap:4px;z-index:3}
#zoomctl button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px}
.mobbtn{display:none}
@media (max-width:900px){
  #main{grid-template-columns:1fr}
  #palette,#props{position:absolute;top:0;bottom:0;z-index:20;width:min(300px,86vw);box-shadow:0 0 30px rgba(0,0,0,.25);display:none}
  #palette{left:0}#props{right:0}
  #palette.show,#props.show{display:block}
  .mobbtn{display:inline-flex}
  .split-h{display:none}
  .hidem{display:none}
}
#printArea{display:none}
@media print{
  @page{size:A3 landscape;margin:0}
  body{overflow:visible;background:#fff}
  #app,#modal,#toast{display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;page-break-after:always;display:block}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="brand"><b>Simulix</b><small>PRO</small><a id="ghLink" href="https://github.com/Pepinou66/simulix-pro" target="_blank" rel="noopener" title="Code source sur GitHub (logiciel libre GPL-3.0)" style="color:#93a4bd;text-decoration:none;font-size:11px;border:1px solid #3a4558;border-radius:4px;padding:1px 6px;font-weight:500">⌥ GitHub</a></div>
    <button class="tb mobbtn" id="bPal" title="Bibliothèque">☰ Biblio</button>
    <button class="tb" id="bNew" title="Nouveau projet">🗋<span class="hidem"> Nouveau</span></button>
    <button class="tb" id="bOpen" title="Ouvrir un projet (.sxp/.json)">📂<span class="hidem"> Ouvrir</span></button>
    <button class="tb" id="bSave" title="Enregistrer le projet">💾<span class="hidem"> Enregistrer</span></button>
    <select class="tbs" id="selEx" title="Exemples"><option value="">Exemples…</option></select>
    <div class="sep"></div>
    <button class="tb" id="bUndo" title="Annuler (Ctrl+Z)">↶</button>
    <button class="tb" id="bRedo" title="Rétablir (Ctrl+Y)">↷</button>
    <button class="tb" id="bRot" title="Pivoter (R)">⟳</button>
    <button class="tb" id="bDup" title="Dupliquer (Ctrl+D)">⧉</button>
    <button class="tb" id="bDel" title="Supprimer (Suppr)">🗑</button>
    <button class="tb" id="bPan" title="Outil main (déplacer la vue)">✋</button>
    <div class="sep"></div>
    <button class="tb run" id="bRun" title="Démarrer la simulation (F5)">▶<span class="hidem"> Simuler</span></button>
    <button class="tb" id="bPause" title="Pause" disabled>⏸</button>
    <button class="tb" id="bStep" title="Pas à pas" disabled>⏭</button>
    <button class="tb" id="bStop" title="Arrêter et réinitialiser" disabled>⏹</button>
    <select class="tbs" id="selSpeed" title="Vitesse de simulation"><option value="0.25">×0.25</option><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="2">×2</option><option value="4">×4</option></select>
    <span id="simtime">0.00 s</span>
    <div class="sep"></div>
    <select class="tbs" id="selView" title="Seconde vue pour voir un autre folio pendant la simulation"><option value="">🗗 Une vue</option><option value="split">⫴ Vue scindée</option><option value="pip">▣ Mini-fenêtre</option></select>
    <button class="tb" id="bPlot" title="Traceur de courbes">📈<span class="hidem"> Traceur</span></button>
    <button class="tb" id="bTrouble" title="Mode dépannage (masque les défaillances)">🛠<span class="hidem"> Dépannage</span></button>
    <button class="tb" id="bTools" title="Outils d'ingénierie">📋<span class="hidem"> Ingénierie</span></button>
    <button class="tb" id="bHelp" title="Aide">?</button>
    <button class="tb mobbtn" id="bProps" title="Propriétés">⚙</button>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div class="split-h" id="splitL" title="Glisser pour redimensionner la bibliothèque"></div>
    <div id="center">
      <div id="views"><canvas id="cv"></canvas><div id="pane2" class="pane2"><div class="p2h"><span class="p2t">Folio</span><select id="p2sel"></select><button id="p2fit" title="Ajuster">⤢</button><button id="p2close" title="Fermer">✕</button></div><canvas id="cv2"></canvas></div></div>
      <div id="modeTag">Édition</div>
      <div id="banner"></div>
      <div id="tip"></div>
      <div id="zoomctl"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="Ajuster">⤢</button></div>
      <div id="sheets"></div>
    </div>
    <div class="split-h" id="splitR" title="Glisser pour redimensionner le panneau"></div>
    <div id="props"></div>
  </div>
  <div id="plot"><canvas id="plotc"></canvas><div id="plotbar"><button id="plotClr">Effacer canaux</button><button id="plotClose">✕</button></div></div>
</div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<div id="ctx"></div>
<input type="file" id="logoIn" accept="image/*" style="display:none">
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".sxp,.json,application/json" style="display:none">
<!--SCRIPTS-->
<script src="util.js"></script>
<script src="comps.js"></script>
<script src="sim.js"></script>
<script src="plc.js"></script>
<script src="core.js"></script>
<script src="tools.js"></script>
<script src="examples.js"></script>
<script>initUI();</script>
<!--/SCRIPTS-->
</body>
</html>
