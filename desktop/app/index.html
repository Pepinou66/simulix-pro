<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Simulix Pro — Conception et simulation de systèmes automatisés</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --line:#d6dbe3; --text:#1d2430; --muted:#6b7686;
  --accent:#0f62fe; --accent2:#e8f0ff; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --top:46px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
#app{display:grid;grid-template-rows:var(--top) 1fr auto;height:100%}
/* ---- top bar ---- */
#top{display:flex;align-items:center;gap:4px;padding:0 8px;background:#151b26;color:#fff;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#brand{font-weight:700;letter-spacing:.3px;margin-right:10px;display:flex;align-items:center;gap:6px}
#brand b{background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{font-weight:600;color:#93a4bd;font-size:10px;border:1px solid #3a4558;border-radius:4px;padding:0 4px}
.tb{background:transparent;color:#dfe6f0;border:1px solid transparent;border-radius:6px;padding:5px 8px;display:inline-flex;align-items:center;gap:5px;flex:none}
.tb:hover{background:#263044}
.tb.on{background:#2b3a55;border-color:#3d5179;color:#fff}
.tb:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:24px;background:#334;margin:0 4px;flex:none}
.tb.run{background:#15803d;color:#fff}
.tb.run:hover{background:#16a34a}
.tb.stop{background:#b91c1c;color:#fff}
#simtime{font-variant-numeric:tabular-nums;color:#9fb3cf;min-width:62px;text-align:right;flex:none}
select.tbs{background:#263044;color:#fff;border:1px solid #3a4558;border-radius:6px;padding:4px;flex:none}
/* ---- main ---- */
#main{display:grid;grid-template-columns:var(--palW,232px) 6px 1fr 6px var(--propW,270px);min-height:0;position:relative}
.split-h{cursor:col-resize;background:#d6dbe3;position:relative;z-index:4}
.split-h:hover,.split-h.on{background:#0f62fe}
#palette,#props{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0}
#props{border-right:0;border-left:1px solid var(--line)}
#center{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#views{flex:1;display:flex;min-height:0;position:relative}
#cv{flex:1;display:block;width:100%;min-width:0;min-height:0;touch-action:none;background:#fbfcfd;cursor:default}
#sheets{display:flex;gap:2px;padding:3px 6px 0;background:#e3e8ef;border-top:1px solid var(--line);overflow-x:auto;flex:none}
#sheets button{border:1px solid var(--line);border-bottom:0;background:#f4f6f9;border-radius:6px 6px 0 0;padding:4px 10px;color:var(--muted)}
#sheets button.on{background:#fff;color:var(--text);font-weight:600}
.pal-search{position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid var(--line);z-index:2}
.pal-search input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.cat{border-bottom:1px solid #eef0f3}
.cat>h4{margin:0;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#4a5568;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.cat>h4:hover{background:#f6f8fb}
.cat .items{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 8px 8px}
.cat.closed .items{display:none}
.pi{border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px;text-align:center;font-size:10.5px;line-height:1.15;color:#334;cursor:pointer;user-select:none;touch-action:none}
.pi:hover{border-color:var(--accent);background:var(--accent2)}
.pi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2) inset;background:var(--accent2)}
.pi canvas{display:block;margin:0 auto 2px;width:96px;height:52px}
/* ---- props ---- */
#props h3{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);background:#f8fafc;position:sticky;top:0;z-index:1}
.pp{padding:10px 12px}
.row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.row label{font-size:11px;color:var(--muted);font-weight:600}
.row input,.row select,.row textarea{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
.row.chk{flex-direction:row;align-items:center;gap:6px}
.row.chk input{width:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.dng{color:var(--err)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;background:#f6f8fb;border:1px solid #e8ecf2;border-radius:6px;padding:7px 9px;margin-bottom:9px}
.kv b{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:11.5px;line-height:1.4}
.badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.5px;font-weight:600;background:#eef2f7;color:#445}
.badge.err{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#15803d}.badge.warn{background:#fef3c7;color:#92400e}
/* ---- plot ---- */
#plot{background:#0f1520;color:#cfe;border-top:1px solid #000;height:0;overflow:hidden;transition:height .15s;position:relative}
#plot.open{height:190px}
#plotc{width:100%;height:100%;display:block}
#plotbar{position:absolute;right:6px;top:4px;display:flex;gap:4px}
#plotbar button{background:#1d2738;color:#cde;border:1px solid #2d3a50;border-radius:5px;padding:2px 7px;font-size:11px}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal.open{display:flex}
.dlg{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(1150px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.sm{width:min(560px,100%)}
.dlg header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f8fafc}
.dlg header h2{margin:0;font-size:15px;flex:1}
.dlg .body{overflow:auto;padding:12px 14px;flex:1;min-height:0}
.dlg footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;background:#f8fafc}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--text);font-weight:600}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid #e3e7ee;padding:4px 6px;text-align:left}
table.grid th{background:#f3f6fa;position:sticky;top:0}
table.grid td input{width:100%;border:1px solid transparent;padding:2px 4px;border-radius:4px}
table.grid td input:focus{border-color:var(--accent);outline:none}
/* ladder */
.ltools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ltools button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ltools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lwrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lgrid{border-left:4px solid #334;border-right:4px solid #334;overflow:auto;background:#fff;user-select:none}
.lgrid table{border-collapse:collapse}
.lgrid td{width:84px;height:54px;padding:0;border:1px dashed #edf0f4;position:relative;cursor:pointer}
.lgrid td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.lgrid td.rn{width:28px;color:#99a;font-size:10px;text-align:center;border:0;cursor:default;background:#fafbfc}
.lgrid svg{display:block;width:84px;height:54px}
.lside{min-width:220px;flex:1}
.gwrap{display:flex;gap:12px;flex-wrap:wrap}
.gwrap>div{flex:1;min-width:300px}
.gsvg{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;max-height:60vh}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1}
#pzLeg{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid #cbd5e1;border-radius:8px;padding:6px 9px;font-size:11px;display:none;flex-direction:column;gap:2px;z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.08)}#pzLeg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}#pzLeg label{display:flex;align-items:center;gap:4px;margin-top:3px;color:#475569}#pzLeg input{width:auto;margin:0}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--err);color:#fff;font-weight:700;padding:5px 12px;border-radius:6px;display:none;z-index:5}
/* seconde vue : scindée ou mini-fenêtre */
.pane2{display:none;flex-direction:column;background:#fff;min-width:0;min-height:0}
.pane2 canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none;background:#fbfcfd}
.p2h{display:flex;align-items:center;gap:6px;padding:4px 6px;background:#1e293b;color:#e2e8f0;font-size:12px;cursor:default;user-select:none}
.p2h select{flex:1;min-width:0;background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:2px 4px;font-size:12px}
.p2h button{background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:1px 7px}
#views.split .pane2{display:flex;flex:1;border-left:3px solid #1e293b}
#views.pip .pane2{display:flex;position:absolute;right:56px;bottom:12px;width:420px;height:280px;border:2px solid #1e293b;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:7;resize:both;min-width:220px;min-height:150px}
#views.pip .p2h{cursor:move}
#ctx{position:fixed;display:none;z-index:70;background:#fff;border:1px solid #d6dbe3;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;min-width:210px;font-size:13px;max-height:80vh;overflow:auto}
#ctx .it{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
#ctx .it:hover{background:#eef4ff}
#ctx .it.dis{opacity:.4;pointer-events:none}
#ctx .sep2{height:1px;background:#e5e7eb;margin:4px 2px}
#ctx .hd{padding:4px 10px;font-size:11px;color:#6b7686;font-weight:600}
#ctx input{width:100%;padding:5px 7px;border:1px solid #d6dbe3;border-radius:5px;margin:2px 0 4px}
#tip{position:absolute;display:none;pointer-events:none;background:#111827;color:#f9fafb;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
#modeTag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);pointer-events:none}
#zoomctl{position:absolute;right:8px;bottom:36px;display:flex;flex-direction:column;gap:4px;z-index:3}
#zoomctl button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px}
.mobbtn{display:none}
@media (max-width:900px){
  #main{grid-template-columns:1fr}
  #palette,#props{position:absolute;top:0;bottom:0;z-index:20;width:min(300px,86vw);box-shadow:0 0 30px rgba(0,0,0,.25);display:none}
  #palette{left:0}#props{right:0}
  #palette.show,#props.show{display:block}
  .mobbtn{display:inline-flex}
  .split-h{display:none}
  .hidem{display:none}
}
#printArea{display:none}
@media print{
  @page{size:A3 landscape;margin:0}
  body{overflow:visible;background:#fff}
  #app,#modal,#toast{display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;page-break-after:always;display:block}
}
</style>
</head>

<script>
'use strict';
/* ===== Utilitaires communs ===== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = (v, d = 1) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);

class UF {
  constructor() { this.p = new Map(); }
  find(k) {
    let p = this.p.get(k);
    if (p === undefined) { this.p.set(k, k); return k; }
    if (p === k) return k;
    const r = this.find(p); this.p.set(k, r); return r;
  }
  union(a, b) { const ra = this.find(a), rb = this.find(b); if (ra !== rb) this.p.set(ra, rb); }
}

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---- primitives de dessin (contexte local du composant) ---- */
const D = {
  line(ctx, pts, w) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); if (w) ctx.lineWidth = w; ctx.stroke(); },
  rect(ctx, x, y, w, h, fill) { if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); } ctx.strokeRect(x, y, w, h); },
  circle(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.stroke(); },
  text(ctx, s, x, y, size = 10, color = '#222', align = 'center', bold) {
    ctx.save(); ctx.fillStyle = color; ctx.font = (bold ? '600 ' : '') + size + 'px system-ui,sans-serif'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore();
  },
  arrow(ctx, x1, y1, x2, y2, hs = 6) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - hs * Math.cos(a - 0.4), y2 - hs * Math.sin(a - 0.4));
    ctx.lineTo(x2 - hs * Math.cos(a + 0.4), y2 - hs * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  },
  tri(ctx, x, y, s, dir, fill) { // triangle plein pointant dir: 'u','d','l','r'
    ctx.beginPath();
    if (dir === 'u') { ctx.moveTo(x, y - s); ctx.lineTo(x - s, y + s * .7); ctx.lineTo(x + s, y + s * .7); }
    if (dir === 'd') { ctx.moveTo(x, y + s); ctx.lineTo(x - s, y - s * .7); ctx.lineTo(x + s, y - s * .7); }
    if (dir === 'r') { ctx.moveTo(x + s, y); ctx.lineTo(x - s * .7, y - s); ctx.lineTo(x - s * .7, y + s); }
    if (dir === 'l') { ctx.moveTo(x - s, y); ctx.lineTo(x + s * .7, y - s); ctx.lineTo(x + s * .7, y + s); }
    ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.stroke();
  },
  spring(ctx, x1, y, x2, h = 7) {
    const n = 6, dx = (x2 - x1) / n; ctx.beginPath(); ctx.moveTo(x1, y);
    for (let i = 0; i < n; i++) ctx.lineTo(x1 + dx * (i + .5), y + (i % 2 ? h : -h));
    ctx.lineTo(x2, y); ctx.stroke();
  },
  dash(ctx, on) { ctx.setLineDash(on ? [4, 3] : []); }
};

function download(name, text, mime = 'application/json') {
  // Les téléchargements peuvent être bloqués (cadre sandbox) : on propose aussi la copie
  let ok = false;
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove(); ok = true;
  } catch (e) { ok = false; }
  return ok;
}
function copyText(text) {
  try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

<script>
'use strict';
/* =====================================================================
   Bibliothèque de composants
   Chaque définition peut fournir :
     w,h | size(c)         dimensions (px monde, non pivoté)
     ports | portsFn(c)    [{id,x,y,k}]  k: e=électrique p=pneumatique h=hydraulique f=fluide l=logique x=universel
     links(c,S)            connexions internes [[p1,p2,(facteur)]]
     dlinks(c,S)           connexions directionnelles (calculées après une 1re passe)
     sources(c,S)          [[port,type,val]] type: + 0 pneu hyd vent tank
     loads(c)              charges électriques [[a,b,watts]]
     update(c,S)           évaluation instantanée -> true si l'état change
     step(c,S,dt)          évolution temporelle
     lout(c,S) / lstep     logique numérique
     press/release(c,x,y)  interaction en simulation
     draw(ctx,c,S)         dessin
     fields, faults, catalog, plot
   ===================================================================== */
const DEFS = {};
const CATS = [];
function def(type, o) { DEFS[type] = Object.assign({ type, w: 40, h: 60 }, o); if (o.cat && !CATS.includes(o.cat)) CATS.push(o.cat); }
const INK = '#1f2937';

const st = c => c.state || (c.state = {});
const medK = c => (c.props.medium === 'hyd' ? 'h' : 'p');

function faultList(c) { const d = DEFS[c.type]; return d.faultsFn ? d.faultsFn(c) : (d.faults || []); }
function faultLabel(c) { const f = faultList(c).find(x => x[0] === c.fault); return f ? f[1] : c.fault; }
function contactState(c, logical) { if (c.fault === 'open') return false; if (c.fault === 'closed') return true; return logical; }
function cylAt(S, tag, pos) {
  const cy = S && S.cyl[tag]; if (!cy) return false;
  const p = cy.state.pos || 0;
  if (pos === 'sorti') return p >= 0.985;
  if (pos === 'rentré' || pos === 'rentre') return p <= 0.015;
  const v = parseFloat(pos); if (!isNaN(v)) return Math.abs(p * 100 - v) < 2.5;
  return false;
}
const TAGF = { k: 'tag', label: 'Repère', type: 'text' };
const REFF = { k: 'ref', label: 'Référence catalogue', type: 'text' };
const PWF = { k: 'power', label: 'Puissance (W)', type: 'num', step: 0.5 };
const VNF = { k: 'vnom', label: 'Tension nominale (V)', type: 'sel', opts: ['12', '24', '48', '110', '230', '400'] };

/* ---------- Dessins de contacts électriques ---------- */
function drawContact(ctx, c, closed, nc, actuator) {
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  D.line(ctx, [20, 0, 20, 16]); D.line(ctx, [20, 44, 20, 60]);
  if (nc) D.line(ctx, [20, 16, 28, 16]);
  ctx.lineWidth = 2;
  if (closed) D.line(ctx, [20, 44, nc ? 29 : 20, nc ? 14 : 15]);
  else D.line(ctx, [20, 44, nc ? 9 : 7, nc ? 17 : 19]);
  ctx.lineWidth = 1.3;
  const mx = closed ? (nc ? 24 : 20) : (nc ? 14 : 13), my = 30;
  if (actuator === 'push') { D.dash(ctx, 1); D.line(ctx, [mx, my, 2, my]); D.dash(ctx, 0); D.line(ctx, [2, my - 6, 2, my + 6, -2, my + 6]); D.line(ctx, [2, my - 6, -2, my - 6]); }
  if (actuator === 'toggle') { D.dash(ctx, 1); D.line(ctx, [mx, my, 2, my]); D.dash(ctx, 0); D.line(ctx, [2, my - 6, 2, my + 6]); D.line(ctx, [2, my - 6, -3, my - 6]); D.line(ctx, [2, my + 6, 7, my + 6]); }
  if (actuator === 'estop') { D.dash(ctx, 1); D.line(ctx, [mx, my, 2, my]); D.dash(ctx, 0); ctx.beginPath(); ctx.arc(-3, my, 7, -Math.PI / 2, Math.PI / 2); ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.stroke(); }
  if (actuator === 'limit') { D.dash(ctx, 1); D.line(ctx, [mx, my, 4, my]); D.dash(ctx, 0); D.line(ctx, [4, my - 6, -2, my, 4, my + 6]); D.circle(ctx, -4, my, 3); }
  if (actuator === 'press') { D.dash(ctx, 1); D.line(ctx, [mx, my, 4, my]); D.dash(ctx, 0); D.rect(ctx, -6, my - 6, 10, 12); D.text(ctx, 'P', -1, my, 8); }
  if (actuator === 'prox') { D.dash(ctx, 1); D.line(ctx, [mx, my, 4, my]); D.dash(ctx, 0); ctx.beginPath(); ctx.moveTo(4, my - 7); ctx.lineTo(-4, my); ctx.lineTo(4, my + 7); ctx.stroke(); D.line(ctx, [-6, my - 4, -6, my + 4]); }
}

/* ---------- Contacts (2 bornes a/b) ---------- */
function contactDef(type, name, nc, act, extra = {}) {
  def(type, Object.assign({
    name, cat: 'Électrique — commande', w: 40, h: 60,
    ports: [P('a', 20, 0, 'e'), P('b', 20, 60, 'e')],
    fields: [TAGF], faults: [['open', 'Contact reste ouvert'], ['closed', 'Contact collé (fermé)']],
    closed(c) { const a = !!st(c).act; return contactState(c, nc ? !a : a); },
    links(c) { return this.closed(c) ? [['a', 'b']] : []; },
    draw(ctx, c) { drawContact(ctx, c, this.closed(c), nc, act); },
    plot: c => DEFS[c.type].closed(c) ? 1 : 0, plotUnit: 'état',
    bom: nc ? 'Contact NF' : 'Contact NO'
  }, extra));
}
const pushHandlers = {
  press(c) { st(c).act = true; return true; },
  release(c) { st(c).act = false; return true; }, hint: () => 'Maintenir le clic : appuyer sur le bouton'
};
const toggleHandlers = { press(c) { st(c).act = !st(c).act; return true; }, hint: c => st(c).act ? 'Cliquer : relâcher' : 'Cliquer : actionner (accrochage)' };
const manHandlers = { press(c) { st(c).man = true; return true; }, release(c) { st(c).man = false; return true; }, hint: c => 'Maintenir le clic : actionner manuellement (sinon commandé par le vérin ' + (c.props.cyl || '?') + ')' };
contactDef('pb_no', 'Bouton poussoir NO', false, 'push', Object.assign({ defProps: { tag: 'S1' }, bom: 'Bouton poussoir 1NO' }, pushHandlers));
contactDef('pb_nc', 'Bouton poussoir NF', true, 'push', Object.assign({ defProps: { tag: 'S0' }, bom: 'Bouton poussoir 1NF' }, pushHandlers));
contactDef('sw_no', 'Commutateur à accrochage', false, 'toggle', Object.assign({ defProps: { tag: 'S2' }, bom: 'Commutateur 2 positions' }, toggleHandlers));
contactDef('estop', 'Arrêt d\'urgence (NF)', true, 'estop', Object.assign({ defProps: { tag: 'AU' }, bom: 'Arrêt d\'urgence coup de poing' }, toggleHandlers));
const tagUpdate = function (c, S) { const a = !!S.tags[c.props.tag]; if (st(c).act !== a) { st(c).act = a; return true; } return false; };
contactDef('k_no', 'Contact de relais NO', false, null, { defProps: { tag: 'K1' }, update: tagUpdate, info: c => 'Commandé par la bobine ' + c.props.tag, bom: 'Contact auxiliaire NO' });
contactDef('k_nc', 'Contact de relais NF', true, null, { defProps: { tag: 'K1' }, update: tagUpdate, info: c => 'Commandé par la bobine ' + c.props.tag, bom: 'Contact auxiliaire NF' });
const cylFields = [TAGF, { k: 'cyl', label: 'Vérin / actionneur associé', type: 'text' }, { k: 'pos', label: 'Position (rentré, sorti ou %)', type: 'sel', opts: ['rentré', 'sorti', '25', '50', '75'] }];
const limUpdate = function (c, S) { const a = cylAt(S, c.props.cyl, c.props.pos) || !!st(c).man; if (st(c).act !== a) { st(c).act = a; return true; } return false; };
contactDef('ls_no', 'Fin de course NO', false, 'limit', { defProps: { tag: '1S2', cyl: 'A', pos: 'sorti' }, fields: cylFields, update: limUpdate, bom: 'Interrupteur de position à galet 1NO', ...manHandlers });
contactDef('ls_nc', 'Fin de course NF', true, 'limit', { defProps: { tag: '1S1', cyl: 'A', pos: 'rentré' }, fields: cylFields, update: limUpdate, bom: 'Interrupteur de position à galet 1NF', ...manHandlers });
contactDef('prox', 'Détecteur de proximité', false, 'prox', { defProps: { tag: 'B1', cyl: 'A', pos: 'sorti' }, fields: cylFields, update: limUpdate, bom: 'Détecteur inductif PNP', ...manHandlers });

/* ---------- Charges électriques ---------- */
function loadDef(type, name, o) {
  def(type, Object.assign({
    name, cat: 'Électrique — commande', w: 40, h: 60,
    ports: [P('a', 20, 0, 'e'), P('b', 20, 60, 'e')],
    faults: [['open', 'Bobine / charge coupée']],
    loads(c) { return (c.fault === 'open' || st(c).burnt) ? [] : [['a', 'b', +c.props.power || 2]]; },
    update(c, S) {
      const on = c.fault !== 'open' && S.loadOn(c, 'a', 'b');
      let ch = false; if (st(c).on !== on) { st(c).on = on; ch = true; }
      if (this.setsTag && c.props.tag) { if (S.tags[c.props.tag] !== on) S.tags[c.props.tag] = on; }
      return ch;
    },
    plot: c => st(c).on ? 1 : 0, plotUnit: 'état'
  }, o));
}
loadDef('coil', 'Bobine de relais', {
  setsTag: true, defProps: { tag: 'K1', power: 3 }, fields: [TAGF, VNF, PWF, REFF], bom: c => 'Relais / contacteur bobine ' + (c.props.vnom || 24) + ' V',
  draw(ctx, c) { ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 18]); D.line(ctx, [20, 42, 20, 60]); D.rect(ctx, 6, 18, 28, 24, st(c).on ? ON_FILL : '#fff'); }
});
loadDef('coil_t', 'Relais temporisé', {
  defProps: { tag: 'KT1', power: 3, delay: 3, mode: 'travail' },
  fields: [TAGF, { k: 'delay', label: 'Temporisation (s)', type: 'num', step: 0.1 }, { k: 'mode', label: 'Type', type: 'sel', opts: ['travail', 'repos'] }, VNF, PWF, REFF],
  bom: 'Relais temporisé 24 V DC',
  update(c, S) {
    const s = st(c); const on = c.fault !== 'open' && S.loadOn(c, 'a', 'b');
    let ch = false; if (s.on !== on) { s.on = on; ch = true; }
    const d = +c.props.delay || 0;
    const out = c.props.mode === 'repos' ? (on || !!s.out) : (on && (s.acc || 0) >= d);
    if (S.tags[c.props.tag] !== out) { S.tags[c.props.tag] = out; ch = true; }
    return ch;
  },
  step(c, S, dt) {
    const s = st(c); const d = +c.props.delay || 0;
    if (c.props.mode === 'repos') { if (s.on) { s.out = true; s.acc = 0; } else if (s.out) { s.acc = (s.acc || 0) + dt; if (s.acc >= d) s.out = false; } }
    else { s.acc = s.on ? (s.acc || 0) + dt : 0; }
  },
  draw(ctx, c) {
    const s = st(c); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 18]); D.line(ctx, [20, 42, 20, 60]);
    D.rect(ctx, 6, 18, 28, 24, s.on ? ON_FILL : '#fff');
    ctx.fillStyle = INK; ctx.fillRect(c.props.mode === 'repos' ? 28 : 6, 18, 6, 24);
    if (s.on || s.out) { const d = +c.props.delay || 1; const r = clamp((s.acc || 0) / d, 0, 1); ctx.fillStyle = '#0f62fe'; ctx.fillRect(12, 38, 14 * r, 2); }
  },
  probe: c => ({ 'Temps écoulé': fmt(st(c).acc || 0, 2) + ' s' })
});
loadDef('sol', 'Solénoïde de distributeur', {
  setsTag: true, info: c => 'Commande les distributeurs dont l\'électro-aimant est ' + c.props.tag + ' (clic sur le distributeur : commande manuelle)', defProps: { tag: 'Y1', power: 5 }, fields: [TAGF, VNF, PWF], bom: c => 'Bobine de distributeur ' + (c.props.vnom || 24) + ' V',
  draw(ctx, c) { ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 18]); D.line(ctx, [20, 42, 20, 60]); D.rect(ctx, 6, 18, 28, 24, st(c).on ? ON_FILL : '#fff'); D.line(ctx, [6, 42, 34, 18]); }
});
const LAMPC = { rouge: '#ef4444', vert: '#22c55e', orange: '#f59e0b', bleu: '#3b82f6', blanc: '#f8fafc', jaune: '#facc15' };
loadDef('lamp', 'Voyant', {
  defProps: { tag: 'H1', power: 2, color: 'vert' }, fields: [TAGF, { k: 'color', label: 'Couleur', type: 'sel', opts: Object.keys(LAMPC) }, VNF, PWF], bom: c => 'Voyant lumineux ' + (c.props.vnom || 24) + ' V',
  draw(ctx, c) {
    const on = st(c).on; ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 16]); D.line(ctx, [20, 44, 20, 60]);
    if (on) { ctx.save(); ctx.shadowColor = LAMPC[c.props.color] || '#fff'; ctx.shadowBlur = 18; D.circle(ctx, 20, 30, 14, LAMPC[c.props.color]); ctx.restore(); }
    else D.circle(ctx, 20, 30, 14, '#fff');
    D.line(ctx, [10, 20, 30, 40]); D.line(ctx, [30, 20, 10, 40]);
  }
});
loadDef('motor', 'Moteur électrique CC', {
  defProps: { tag: 'M1', power: 60 }, fields: [TAGF, VNF, PWF, REFF], bom: c => (+c.props.vnom >= 110 ? 'Moteur monophasé ' : 'Moteur ') + (c.props.vnom || 24) + ' V',
  step(c, S, dt) { const s = st(c); s.ang = ((s.ang || 0) + (s.on ? dt * 6 : 0)) % (Math.PI * 2); },
  draw(ctx, c) {
    const s = st(c); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 12]); D.line(ctx, [20, 48, 20, 60]);
    D.circle(ctx, 20, 30, 18, s.on ? '#dbeafe' : '#fff'); D.text(ctx, 'M', 20, 28, 13, INK, 'center', true); D.text(ctx, '⎓', 20, 40, 9);
    if (s.on) { const a = s.ang || 0; ctx.strokeStyle = '#2563eb'; D.line(ctx, [20 + 15 * Math.cos(a), 30 + 15 * Math.sin(a), 20 + 11 * Math.cos(a), 30 + 11 * Math.sin(a)]); }
  }
});
loadDef('buzzer', 'Avertisseur sonore', {
  defProps: { tag: 'H2', power: 2 }, fields: [TAGF, VNF, PWF], bom: c => 'Avertisseur ' + (c.props.vnom || 24) + ' V',
  draw(ctx, c) {
    const on = st(c).on; ctx.strokeStyle = INK; ctx.lineWidth = 1.6; D.line(ctx, [20, 0, 20, 20]); D.line(ctx, [20, 44, 20, 60]);
    ctx.beginPath(); ctx.arc(20, 32, 13, Math.PI, 0); ctx.closePath(); ctx.fillStyle = on ? ON_FILL : '#fff'; ctx.fill(); ctx.stroke();
    D.line(ctx, [7, 32, 7, 44, 33, 44, 33, 32]);
    if (on && (Date.now() / 120 | 0) % 2) { ctx.strokeStyle = '#f59e0b'; D.line(ctx, [36, 22, 40, 18]); D.line(ctx, [37, 30, 42, 30]); }

});

/* ---------- Alimentation et mesures électriques ---------- */
def('supply', {
  name: 'Alimentation 24 V DC', cat: 'Électrique — commande', w: 40, h: 80,
  ports: [P('+', 20, 0, 'e'), P('0', 20, 80, 'e')],

  sources(c, S) { if (c.fault === 'off' || S.trip[c.id]) return []; const U = +c.props.U || 24; return [['+', 'pot', { sys: c.id, re: 0, im: 0, dc: U, ph: '+' }], ['0', 'pot', { sys: c.id, re: 0, im: 0, dc: 0, ph: '0' }]]; },
  press(c, x, y, S) { if (S && S.trip[c.id]) { delete S.trip[c.id]; toast('Protection réarmée'); return true; } },

def('vm', {

/* =====================================================================
   ÉLECTRIQUE — PUISSANCE (réseaux 230 V / 400 V, mono et triphasé)
   Potentiels en phaseurs : V = U/√3 par phase, L1 0°, L2 −120°, L3 +120°
   ===================================================================== */

const ph = (sys, V, deg, label) => ({ sys, re: V * Math.cos(deg * Math.PI / 180), im: V * Math.sin(deg * Math.PI / 180), dc: 0, ph: label });
const mainsReset = { press(c, x, y, S) { if (S && S.trip[c.id]) { delete S.trip[c.id]; toast('Alimentation réarmée'); return true; } } };

  },

}, mainsReset));
def('mains1', Object.assign({
  name: 'Réseau monophasé (L + N + PE)', cat: PCAT, w: 120, h: 60, mains: true,

        let v = inp.type === 'checkbox' ? inp.checked : inp.value; if (f && (f.type === 'num' || f.type === 'range')) v = +v;
        c.props[inp.dataset.k] = v; if (f.type === 'range') { const b = $('#rv_' + f.k); if (b) b.textContent = v; }
        if (['vt', 'aL', 'aR', 'xL', 'xR', 'single', 'medium'].includes(inp.dataset.k)) { App.pruneWires(); App.changed(); return Props.render(); }

      inp.onchange = apply; if (f && f.type === 'range') inp.oninput = () => { c.props[f.k] = +inp.value; const b = $('#rv_' + f.k); if (b) b.textContent = inp.value; };
    });
    const pc = $('#pCat'); if (pc) pc.onchange = () => { const x = cat[+pc.value]; if (!x) return; Object.assign(c.props, x.props); c.props.ref = x.ref; App.changed(); };

  probe() {

    const d = DEFS[c.type]; if (!d.probe) { el.innerHTML = ''; return; }

    el.innerHTML = `<div class="kv">${ks.map(k => `<span>${esc(k)}</span><b>${esc(o[k])}</b>`).join('')}</div>`;
  },
  renderWire(el) {
    const w = App.wires.find(x => x.id === App.selWire); if (!w) { App.selWire = null; return this.render(); }
    const A = portRef(w.a), B = portRef(w.b);
    let h = `<h3>${w.name ? esc(w.name) + ' — ' : ''}Liaison ${kname(w.kind)}</h3><div class="pp"><div class="kv"><span>De</span><b>${esc(A ? (A.c.props.tag || DEFS[A.c.type].name) + ' : ' + A.p.id : '?')}</b><span>Vers</span><b>${esc(B ? (B.c.props.tag || DEFS[B.c.type].name) + ' : ' + B.p.id : '?')}</b>`;
    if (Sim.S && A) { const S = Sim.S; if (w.kind === 'e' || w.kind === 'x') { const pt = S.pot(A.c, A.p.id); h += `<span>Potentiel</span><b>${!pt ? 'non alimenté' : (pt.ph || '') + ' — ' + (pt.dc ? pt.dc + ' V DC' : fmt(Math.hypot(pt.re, pt.im), 0) + ' V AC / terre')}</b>`; } else if (w.kind !== 'l') { h += `<span>Pression</span><b>${fmt(S.P(A.c, A.p.id), 2)} bar</b><span>Débit</span><b>${fmt(S.Q(A.c, A.p.id), 2)} L/min</b>`; const tw = wireTemp(w, S); if (tw != null) h += `<span>Température</span><b>${fmt(tw, 1)} °C</b>`; } }
    h += `</div>`;
    const fl = w.kind !== 'e' && w.kind !== 'l' && w.kind !== 'x';
    h += `<div class="row"><label>Nom ${fl ? 'du flexible / de la conduite' : 'du fil / du câble'}</label><input id="wName" value="${esc(w.name || '')}" placeholder="${fl ? 'ex. FL1, conduite P' : 'ex. W12'}"></div>
      <div class="row"><label>Référence</label><input id="wRef" value="${esc(w.ref || '')}" placeholder="${fl ? 'ex. Flexible 2SN DN10 L=1 m' : 'ex. H07V-K 1,5 mm²'}"></div>
      <div class="row"><label>Couleur</label><div style="display:flex;gap:6px;align-items:center"><input type="color" id="wCol" value="${w.color || (WCOL[w.kind] || '#334155')}" style="width:48px;height:30px;padding:1px"><button class="btn" id="wColAuto">Automatique</button></div></div>
      <div class="row chk"><input type="checkbox" id="wKeep" ${w.keepColor ? 'checked' : ''}><label>Garder cette couleur pendant la simulation (sinon : couleur d'état pression / tension)</label></div>
      <div class="btns">`;
    if (!App.hideFaults) h += `<button class="btn" id="wCut">${w.cut ? (fl ? '✔ Remplacer le flexible' : '✔ Réparer le fil') : (fl ? '💥 Simuler une rupture de flexible' : '✂ Simuler un fil coupé')}</button>`;
    else h += `<button class="btn" id="wRep">🔎 Signaler ${fl ? 'ce flexible comme rompu' : 'ce fil comme coupé'}</button>`;
    if (!Sim.S) h += `<button class="btn" id="wReset">Tracé automatique</button><button class="btn dng" onclick="App.delSel()">🗑 Supprimer</button>`;
    h += `</div><p class="hint">Faites glisser n'importe quel segment (horizontal ou vertical) pour le déplacer ; un segment collé à un orifice crée un nouveau coude.</p></div>`;
    el.innerHTML = h;
    const cut = $('#wCut'); if (cut) cut.onclick = () => { w.cut = !w.cut; App.changed(); };
    $('#wName').onchange = e => { w.name = e.target.value.trim(); App.changed(); };
    $('#wRef').onchange = e => { w.ref = e.target.value.trim(); App.changed(); };
    $('#wCol').oninput = e => { w.color = e.target.value; }; $('#wCol').onchange = () => App.changed();
    $('#wColAuto').onclick = () => { w.color = ''; App.changed(); };
    $('#wKeep').onchange = e => { w.keepColor = e.target.checked; App.changed(); };
    const rs = $('#wReset'); if (rs) rs.onclick = () => { w.mo = null; w.route = null; App.changed(); };
    const rp = $('#wRep'); if (rp) rp.onclick = () => Trouble.report(null, w);
  },
  renderProject(el) {
    const P = App.project, n = App.comps.length;
    el.innerHTML = `<h3>Projet</h3><div class="pp">
      ${['name:Nom du projet', 'author:Auteur', 'company:Société', 'rev:Révision', 'date:Date'].map(s => { const [k, l] = s.split(':'); return `<div class="row"><label>${l}</label><input data-pk="${k}" value="${esc(P[k] || '')}"></div>`; }).join('')}
      <div class="row"><label>Logo du cartouche</label>${P.logo ? `<img src="${P.logo}" style="max-width:100%;max-height:70px;object-fit:contain;border:1px solid #e3e7ee;border-radius:6px;padding:4px;background:#fff">` : '<span class="hint">Aucun logo</span>'}<div class="btns"><button class="btn" id="logoSet">${P.logo ? 'Changer le logo…' : 'Ajouter un logo…'}</button>${P.logo ? '<button class="btn dng" id="logoDel">Retirer</button>' : ''}</div></div>
      <div class="row"><label>Folio actif</label><input id="shName" value="${esc(App.sheets[App.sheet].name)}"></div>
      <div class="btns"><button class="btn dng" id="shDel">Supprimer ce folio</button></div>
      <div class="row chk"><input type="checkbox" id="oFrame" ${App.opts.frame ? 'checked' : ''}><label>Cadre et cartouche</label></div>
      <div class="row chk"><input type="checkbox" id="oNums" ${App.opts.wireNums ? 'checked' : ''}><label>Numérotation des fils électriques</label></div>
      <div class="row chk"><input type="checkbox" id="oXref" ${App.opts.xref ? 'checked' : ''}><label>Références croisées</label></div>
      <div class="kv"><span>Composants</span><b>${n}</b><span>Liaisons</span><b>${App.wires.length}</b><span>Folios</span><b>${App.sheets.length}</b></div>
      <p class="hint"><b>Prise en main</b> : choisissez un composant dans la bibliothèque puis cliquez sur le schéma. Cliquez sur un orifice ou une borne puis sur un autre pour créer une liaison. Lancez la simulation avec ▶ puis cliquez sur les boutons, leviers et capteurs pour les actionner. Double-cliquez sur un automate pour le programmer.</p></div>`;
    el.querySelectorAll('[data-pk]').forEach(i => i.onchange = () => { P[i.dataset.pk] = i.value; App.changed(); });
    $('#shName').onchange = e => { App.sheets[App.sheet].name = e.target.value; Sheets.render(); App.changed(); };
    $('#shDel').onclick = () => Sheets.remove(App.sheet);
    $('#logoSet').onclick = () => $('#logoIn').click(); const ld = $('#logoDel'); if (ld) ld.onclick = () => { delete P.logo; App.changed(); };
    $('#oFrame').onchange = e => { App.opts.frame = e.target.checked; App.changed(); View.fit(); };
    $('#oNums').onchange = e => { App.opts.wireNums = e.target.checked; App.changed(); };
    $('#oXref').onchange = e => { App.opts.xref = e.target.checked; App.changed(); };
  }
};

/* ===================== DÉPANNAGE ===================== */
const Trouble = {
  toggle() { App.hideFaults = !App.hideFaults; $('#bTrouble').classList.toggle('on', App.hideFaults); toast(App.hideFaults ? 'Mode dépannage : les défaillances sont masquées' : 'Mode conception : défaillances visibles'); App.comps.forEach(c => delete c._found); App.changed(); },
  report(c, w) {
    App.reports++;
    const bad = c ? !!c.fault : !!(w && w.cut);
    if (bad) { if (c) c._found = true; App.found++; const fl = c ? faultLabel(c) : 'Fil coupé'; toast('✔ Bien vu ! Défaut identifié : ' + fl, 3500); }
    else toast('✖ Ce ' + (c ? 'composant' : 'fil') + ' fonctionne correctement. Continuez le diagnostic.', 3000);
    const total = App.comps.filter(x => x.fault).length + App.wires.filter(x => x.cut).length;
    if (bad && App.found >= total) setTimeout(() => toast('🎉 Toutes les défaillances ont été trouvées en ' + App.reports + ' tentative(s).', 4500), 1200);
  }
};

/* ===================== TRACEUR ===================== */
const PCOLS = ['#22d3ee', '#f472b6', '#a3e635', '#fbbf24', '#818cf8', '#fb7185', '#34d399', '#f97316'];
const Plot = {
  add(c) { if (App.plot.ch.some(x => x.id === c.id)) return toast('Déjà dans le traceur'); if (App.plot.ch.length >= 8) return toast('8 canaux maximum'); App.plot.ch.push({ id: c.id, data: [], color: PCOLS[App.plot.ch.length % 8] }); this.open(true); },
  open(v) { App.plot.open = v ?? !App.plot.open; $('#plot').classList.toggle('open', App.plot.open); $('#bPlot').classList.toggle('on', App.plot.open); setTimeout(() => View.resize(), 200); },
  sample() { const S = Sim.S; App.plot.ch.forEach(ch => { const c = App.byId(ch.id); if (!c) return; const d = DEFS[c.type]; ch.data.push([S.t, +d.plot.call(d, c, S) || 0]); if (ch.data.length > 2000) ch.data.shift(); }); },
  draw() {
    if (!App.plot.open) return; const el = $('#plotc'), r = el.getBoundingClientRect(); const W = r.width, H = r.height; if (el.width !== Math.round(W * DPR)) { el.width = W * DPR; el.height = H * DPR; }
    const g = el.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = '#0f1520'; g.fillRect(0, 0, W, H);
    const chs = App.plot.ch; if (!chs.length) { D.text(g, 'Sélectionnez un composant puis « Ajouter au traceur » (vérins, manomètres, bobines, alimentation…)', W / 2, H / 2, 12, '#7b8ba3'); return; }
    const t1 = Sim.S ? Sim.S.t : (chs[0].data.at(-1) || [10])[0], span = 15, t0 = Math.max(0, t1 - span), L = 150, lane = (H - 22) / chs.length;
    g.strokeStyle = '#1e293b'; g.lineWidth = 1; for (let t = Math.ceil(t0); t <= t0 + span; t++) { const x = L + (t - t0) / span * (W - L - 10); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H - 18); g.stroke(); if (t % 2 === 0) D.text(g, t + ' s', x, H - 9, 9, '#64748b'); }
    chs.forEach((ch, i) => {
      const c = App.byId(ch.id); if (!c) return; const d = DEFS[c.type], y0 = i * lane + 4, hh = lane - 8;
      const vals = ch.data.filter(p => p[0] >= t0); let mn = Math.min(0, ...vals.map(p => p[1])), mx = Math.max(1, ...vals.map(p => p[1])); if (mx - mn < 1e-6) mx = mn + 1;
      g.strokeStyle = '#1e293b'; g.beginPath(); g.moveTo(L, y0 + hh); g.lineTo(W - 10, y0 + hh); g.stroke();
      D.text(g, (c.props.tag || d.name) + ' (' + d.plotUnit + ')', 8, y0 + 8, 10.5, ch.color, 'left', true);
      const last = vals.length ? vals[vals.length - 1][1] : 0; D.text(g, fmt(last, d.plotUnit === 'état' ? 0 : 1) + '  [' + fmt(mn, 0) + '…' + fmt(mx, 0) + ']', 8, y0 + 22, 9.5, '#94a3b8', 'left');
      g.strokeStyle = ch.color; g.lineWidth = 1.6; g.beginPath();
      vals.forEach((p, k) => { const x = L + (p[0] - t0) / span * (W - L - 10), y = y0 + hh - (p[1] - mn) / (mx - mn) * hh; k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    });
  }
};

/* ===================== CONTRÔLE SIMULATION ===================== */
const Ctl = {
  run() {
    if (!Sim.S) { App.pruneWires(); App.wiring = null; App.placing = null; Pal.mark(); App.plot.ch.forEach(c => c.data = []); Sim.start(); }
    App.running = true; this.syncUI(); Props.render();
  },
  pause() { App.running = false; this.syncUI(); },
  step() { if (!Sim.S) { this.run(); App.running = false; } for (let i = 0; i < 5; i++) { Sim.tick(); Plot.sample(); } this.syncUI(); },
  stop() { App.running = false; Sim.stop(); this.syncUI(); Props.render(); },
  syncUI() {
    const sim = !!Sim.S;
    $('#bRun').disabled = App.running; $('#bPause').disabled = !App.running; $('#bStep').disabled = App.running; $('#bStop').disabled = !sim;
    ['#bUndo', '#bRedo', '#bRot', '#bDup', '#bDel', '#bNew', '#bOpen'].forEach(s => $(s).disabled = sim);
    { const hasH = App.wires.some(w => w.kind === 'h'), hasP = App.wires.some(w => w.kind === 'p'); $('#pzLeg').style.display = sim && (hasH || hasP) ? 'flex' : 'none'; document.querySelectorAll('#pzLeg [data-m]').forEach(e => e.style.display = (e.dataset.m === 'h' ? hasH : hasP) ? '' : 'none'); }
    $('#modeTag').textContent = sim ? (App.running ? '● Simulation en cours' : '❚❚ Simulation en pause') : 'Édition';
    $('#modeTag').style.color = sim ? '#15803d' : '';
    $('#bTrouble').classList.toggle('on', App.hideFaults);
  }
};
/* ===================== SECONDE VUE (scindée / mini-fenêtre) =====================
   Affiche un autre folio en même temps : on actionne les boutons du schéma électrique
   et on voit réagir le pneumatique ou l'hydraulique. Les éléments y sont aussi cliquables. */
const View2 = {
  mode: '', sheet: 1, view: { ox: 20, oy: 20, s: 0.5 }, cv: null, drag: null, fitted: false,
  init() {
    this.cv = $('#cv2'); const cv2 = this.cv;
    $('#selView').onchange = e => this.set(e.target.value);
    $('#p2sel').onchange = e => { this.sheet = +e.target.value; this.fit(); };
    $('#p2fit').onclick = () => this.fit();
    $('#p2close').onclick = () => { this.set(''); $('#selView').value = ''; };
    new ResizeObserver(() => { if (this.mode) this.resize(); }).observe($('#pane2'));
    const w = (e) => { const r = cv2.getBoundingClientRect(); return { sx: e.clientX - r.left, sy: e.clientY - r.top }; };
    const world = (sx, sy) => ({ x: (sx - this.view.ox) / this.view.s, y: (sy - this.view.oy) / this.view.s });
    const onSheet = f => { const k = App.sheet; App.sheet = this.sheet; try { return f(); } finally { App.sheet = k; } };
    cv2.addEventListener('pointerdown', e => {
      cv2.setPointerCapture(e.pointerId); const { sx, sy } = w(e), p = world(sx, sy);
      const c = onSheet(() => hitComp(p));
      if (c && Sim.S) {
        const d = DEFS[c.type];
        if (c.type === 'plc' && this.lastTap && this.lastTap.id === c.id && Date.now() - this.lastTap.t < 350) { PE.open(c); return; }
        this.lastTap = { id: c.id, t: Date.now() };
        if (d.press) { const l = toLocal(c, p.x, p.y); if (d.press(c, l.x, l.y, Sim.S)) { this.drag = { mode: 'press', c }; Sim.settleNow(); return; } }
      }
      if (c && !Sim.S) { App.sheet = this.sheet; App.sel = new Set([c.id]); Sheets.render(); Props.render(); return; }
      this.drag = { mode: 'pan', sx, sy, ox: this.view.ox, oy: this.view.oy };
    });
    cv2.addEventListener('pointermove', e => {
      const { sx, sy } = w(e);
      if (this.drag && this.drag.mode === 'pan') { this.view.ox = this.drag.ox + sx - this.drag.sx; this.view.oy = this.drag.oy + sy - this.drag.sy; return; }
      if (!this.drag && Sim.S) { const c = onSheet(() => hitComp(world(sx, sy))); cv2.style.cursor = c && DEFS[c.type].press ? 'pointer' : 'grab'; this.hover = c ? c.id : null; }
    });
    const up = () => { if (this.drag && this.drag.mode === 'press') { const d = DEFS[this.drag.c.type]; if (d.release && d.release(this.drag.c)) Sim.settleNow(); } this.drag = null; };
    cv2.addEventListener('pointerup', up); cv2.addEventListener('pointercancel', up);
    cv2.addEventListener('wheel', e => { e.preventDefault(); const { sx, sy } = w(e), p = world(sx, sy), f = Math.pow(1.0015, -e.deltaY); this.view.s = clamp(this.view.s * f, 0.1, 4); this.view.ox = sx - p.x * this.view.s; this.view.oy = sy - p.y * this.view.s; }, { passive: false });
    cv2.addEventListener('dblclick', () => this.fit());
    // déplacement de la mini-fenêtre par sa barre de titre
    const head = $('#pane2 .p2h'); let mv = null;
    head.addEventListener('pointerdown', e => { if (this.mode !== 'pip' || e.target.closest('select,button')) return; const pn = $('#pane2'), r = pn.getBoundingClientRect(), pr = $('#views').getBoundingClientRect(); mv = { dx: e.clientX - r.left, dy: e.clientY - r.top, pr }; head.setPointerCapture(e.pointerId); });
    head.addEventListener('pointermove', e => { if (!mv) return; const pn = $('#pane2'); pn.style.left = clamp(e.clientX - mv.pr.left - mv.dx, 0, mv.pr.width - 120) + 'px'; pn.style.top = clamp(e.clientY - mv.pr.top - mv.dy, 0, mv.pr.height - 60) + 'px'; pn.style.right = 'auto'; pn.style.bottom = 'auto'; });
    head.addEventListener('pointerup', () => mv = null);
  },
  set(mode) {
    this.mode = mode; const vw = $('#views'); vw.classList.toggle('split', mode === 'split'); vw.classList.toggle('pip', mode === 'pip');
    if (mode !== 'pip') { const pn = $('#pane2'); pn.style.left = pn.style.top = pn.style.right = pn.style.bottom = ''; }
    if (mode) { if (this.sheet >= App.sheets.length || this.sheet === App.sheet) this.sheet = App.sheets.length > 1 ? (App.sheet === 0 ? 1 : 0) : 0; this.options(); setTimeout(() => { this.resize(); this.fit(); View.resize(); if (mode === 'split') View.fit(); }, 30); }
    else setTimeout(() => View.resize(), 30);
  },
  options() { const sel = $('#p2sel'); sel.innerHTML = App.sheets.map((s, i) => `<option value="${i}" ${i === this.sheet ? 'selected' : ''}>${i + 1}. ${esc(s.name)}</option>`).join(''); },
  resize() { const r = this.cv.getBoundingClientRect(); this.cv.width = Math.max(1, r.width * DPR); this.cv.height = Math.max(1, r.height * DPR); },
  fit() {
    const r = this.cv.getBoundingClientRect(); if (!r.width) return; const cs = App.comps.filter(c => (c.sheet || 0) === this.sheet);
    let b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 }; cs.forEach(c => { const q = compBBox(c); b.x0 = Math.min(b.x0, q.x - 30); b.y0 = Math.min(b.y0, q.y - 30); b.x1 = Math.max(b.x1, q.x + q.w + 30); b.y1 = Math.max(b.y1, q.y + q.h + 30); });
    if (!cs.length) b = { x0: 0, y0: 0, x1: FRAME.w, y1: FRAME.h };
    const s = clamp(Math.min((r.width - 16) / (b.x1 - b.x0), (r.height - 16) / (b.y1 - b.y0)), 0.08, 2);
    this.view = { s, ox: (r.width - (b.x1 - b.x0) * s) / 2 - b.x0 * s, oy: (r.height - (b.y1 - b.y0) * s) / 2 - b.y0 * s };
  },
  render() {
    if (!this.mode) return; const cv2 = this.cv, r = cv2.getBoundingClientRect(); if (cv2.width !== Math.round(r.width * DPR)) this.resize();
    if ($('#p2sel').options.length !== App.sheets.length) this.options();
    const g = cv2.getContext('2d'), v = this.view; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#eef1f5'; g.fillRect(0, 0, cv2.width, cv2.height);
    g.setTransform(DPR * v.s, 0, 0, DPR * v.s, DPR * v.ox, DPR * v.oy);
    const k = App.sheet, fr = App.opts.frame; App.sheet = this.sheet; App.opts.frame = false;
    try {
      drawScene(g, Sim.S, false);
      if (Sim.S && this.hover) { const c = App.byId(this.hover); if (c && (c.sheet || 0) === this.sheet && DEFS[c.type].press) { const b = compBBox(c); g.strokeStyle = 'rgba(15,98,254,.5)'; g.lineWidth = 1.5 / v.s; g.strokeRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10); } }
    } finally { App.sheet = k; App.opts.frame = fr; }
  }
};
let last = performance.now(), acc = 0, probeT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (Sim.S && App.running) { acc += dt * App.speed; let n = 0; while (acc >= DT && n < 40) { Sim.tick(); Plot.sample(); acc -= DT; n++; } if (n >= 40) acc = 0; }
  if (Sim.S) { $('#simtime').textContent = hms(Sim.S.t); const b = $('#banner'); b.style.display = Sim.S.banner ? 'block' : 'none'; b.textContent = Sim.S.banner; } else { $('#simtime').textContent = '00:00:00'; $('#banner').style.display = 'none'; }
  render(); View2.render(); Plot.draw();
  if (now - probeT > 250) { probeT = now; Props.probe(); }
  requestAnimationFrame(loop);
}

</script>
<script>
'use strict';
/* =====================================================================
   Fichiers, outils d'ingénierie, matériel, initialisation
   ===================================================================== */
const NATIVE = window.simulix || null; // API fournie par l'application de bureau

const Files = {

const ARDUINO_SKETCH = `// Simulix Pro — passerelle E/S Arduino (Uno / Nano / Mega)
// Entrées  I0..I7  -> broches D2..D9   (INPUT_PULLUP : contact vers GND = 1)
// Sorties  Q0..Q7  -> broches D10..D13, A0..A3
// Protocole série 115200 bauds : PC -> "Qhh\\n"   Arduino -> "Ihh\\n"
const byte IN_PINS[8]  = {2,3,4,5,6,7,8,9};
const byte OUT_PINS[8] = {10,11,12,13,A0,A1,A2,A3};
byte lastIn = 0xFF; unsigned long lastSend = 0; String buf;

void setup() {
  Serial.begin(115200);
  for (byte i = 0; i < 8; i++) { pinMode(IN_PINS[i], INPUT_PULLUP); pinMode(OUT_PINS[i], OUTPUT); digitalWrite(OUT_PINS[i], LOW); }
}
void loop() {
  byte in = 0;
  for (byte i = 0; i < 8; i++) if (digitalRead(IN_PINS[i]) == LOW) in |= (1 << i);
  if (in != lastIn || millis() - lastSend > 200) {
    Serial.print('I'); if (in < 16) Serial.print('0'); Serial.println(in, HEX);
    lastIn = in; lastSend = millis();
  }
  while (Serial.available()) {
    char c = Serial.read();
    if (c == '\\n') {
      if (buf.length() >= 3 && buf[0] == 'Q') {
        byte q = (byte) strtol(buf.substring(1, 3).c_str(), NULL, 16);
        for (byte i = 0; i < 8; i++) digitalWrite(OUT_PINS[i], (q >> i) & 1 ? HIGH : LOW);
      }
      buf = "";
    } else if (c != '\\r') buf += c;
  }
}
`;

function Proj(name, sheets) {

  o.add = (type, x, y, props = {}, sheet = 0, rot = 0) => {
    const id = 'c' + (n++), d = DEFS[type];
    const pr = Object.assign(JSON.parse(JSON.stringify(d.defProps || {})), props);
    if (type === 'plc' && !pr.prog) pr.prog = PLC.newProg();
    o.comps.push({ id, type, x, y, rot, sheet, props: pr, fault: null }); return id;
  };
  o.w = (a, pa, b, pb, mo = null) => {
    const ca = o.comps.find(c => c.id === a), cb = o.comps.find(c => c.id === b);
